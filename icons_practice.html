<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Interactive Quiz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --correct: #10b981;
            --incorrect: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: #e5e7eb;
            border-radius: 999px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-btn {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eff6ff;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--correct);
            color: #065f46;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--incorrect);
            color: #991b1b;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease-in;
        }

        .screen.active {
            display: block;
        }

        .results-container {
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0%, #e5e7eb 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            position: relative;
        }

        .score-circle::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: var(--card-bg);
            border-radius: 50%;
        }

        .score-text {
            position: relative;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="header">
                <h1>Web Dev Quiz</h1>
                <p>Test your knowledge of HTML, CSS, and JavaScript</p>
            </div>
            <div class="controls" style="justify-content: center;">
                <button class="btn" id="start-btn" style="display: block;">Start Quiz</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            <p id="question-count" style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem;"></p>
            <h2 class="question-text" id="question-text">Question goes here?</h2>
            <div class="options-grid" id="options-grid">
                <!-- Options dynamically injected -->
            </div>
            <div class="controls">
                <button class="btn" id="next-btn">Next Question</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen results-container">
            <h2>Quiz Complete!</h2>
            <p style="color: var(--text-muted); margin: 1rem 0;">Here is how you performed:</p>
            <div class="score-circle" id="score-circle">
                <div class="score-text" id="score-text">0%</div>
            </div>
            <p class="question-text" id="score-summary">You scored 0 out of 0</p>
            <div class="controls" style="justify-content: center;">
                <button class="btn" id="restart-btn" style="display: block;">Retake Quiz</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Preprocessor",
                    "Hyper Text Markup Language",
                    "Hyper Text Multiple Language",
                    "Hyper Tool Multi Language"
                ],
                correct: 1
            },
            {
                question: "Which CSS property is used to control the space inside an element's border?",
                options: ["margin", "padding", "spacing", "width"],
                correct: 1
            },
            {
                question: "Inside which HTML element do we link an external JavaScript file?",
                options: ["<js>", "<scripting>", "<link>", "<script>"],
                correct: 3
            },
            {
                question: "How do you select an element with id 'demo' in CSS?",
                options: [".demo", "#demo", "*demo", "demo"],
                correct: 1
            },
            {
                question: "Which built-in method adds one or more elements to the end of an array?",
                options: ["last()", "put()", "push()", "pop()"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const nextBtn = document.getElementById('next-btn');
        const progress = document.getElementById('progress');
        const questionCount = document.getElementById('question-count');
        
        const scoreCircle = document.getElementById('score-circle');
        const scoreText = document.getElementById('score-text');
        const scoreSummary = document.getElementById('score-summary');

        // Event Listeners
        document.getElementById('start-btn').addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', loadNextQuestion);
        document.getElementById('restart-btn').addEventListener('click', restartQuiz);

        function startQuiz() {
            startScreen.classList.remove('active');
            currentQuestionIndex = 0;
            score = 0;
            quizScreen.classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            resetState();
            
            const currentQuestion = quizData[currentQuestionIndex];
            questionText.innerText = currentQuestion.question;
            questionCount.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            
            const progressPercentage = (currentQuestionIndex / quizData.length) * 100;
            progress.style.width = `${progressPercentage}%`;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('option-btn');
                button.addEventListener('click', () => selectAnswer(button, index));
                optionsGrid.appendChild(button);
            });
        }

        function resetState() {
            nextBtn.style.display = 'none';
            while (optionsGrid.firstChild) {
                optionsGrid.removeChild(optionsGrid.firstChild);
            }
        }

        function selectAnswer(selectedButton, selectedIndex) {
            const correctIndex = quizData[currentQuestionIndex].correct;
            const isCorrect = selectedIndex === correctIndex;

            if (isCorrect) {
                selectedButton.classList.add('correct');
                score++;
            } else {
                selectedButton.classList.add('wrong');
                optionsGrid.children[correctIndex].classList.add('correct');
            }

            Array.from(optionsGrid.children).forEach(button => {
                button.disabled = true;
            });

            nextBtn.style.display = 'block';
            nextBtn.innerText = currentQuestionIndex === quizData.length - 1 ? 'Finish Quiz' : 'Next Question';
        }

        function loadNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.remove('active');
            resultsScreen.classList.add('active');

            const percentage = Math.round((score / quizData.length) * 100);
            scoreSummary.innerText = `You scored ${score} out of ${quizData.length}`;
            
            let currentPercentage = 0;
            const interval = setInterval(() => {
                if (currentPercentage >= percentage) {
                    clearInterval(interval);
                } else {
                    currentPercentage++;
                    scoreText.innerText = `${currentPercentage}%`;
                    scoreCircle.style.background = `conic-gradient(var(--primary) ${currentPercentage}%, #e5e7eb 0%)`;
                }
            }, 20);

            if (percentage === 0) {
                scoreText.innerText = "0%";
                scoreCircle.style.background = `conic-gradient(var(--primary) 0%, #e5e7eb 0%)`;
            }
        }

        function restartQuiz() {
            resultsScreen.classList.remove('active');
            startQuiz();
        }
    </script>
</body>
</html>
